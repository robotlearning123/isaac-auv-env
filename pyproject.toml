[project]
name = "oceanscale"
version = "0.1.0"
description = "GPU-native fluid-structure simulation for underwater robotics"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "OceanScale Team"},
]
keywords = ["robotics", "underwater", "simulation", "gpu", "reinforcement-learning", "bluerov2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "warp-lang[torch-cu12]>=1.13.0,<2.0",
    "newton[examples,torch-cu12]>=1.2.0,<1.3",  # tight upper-bound per R19: 3 minors in 30 days, sub-minor breaking changes documented
    "torch>=2.7.0,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "usd-core>=25.11",
    "hydra-core>=1.3,<2.0",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "rich>=13",
    "cupy-cuda12x>=14.0.1",
    "jax[cuda12]>=0.10.1",
    "gymnasium>=1.2.3",
    # demo path deps — required by `oceanscale demo bluerov2-hover`
    "stable-baselines3>=2.5",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/robotlearning123/46-marine"
Repository = "https://github.com/robotlearning123/46-marine"
Issues = "https://github.com/robotlearning123/46-marine/issues"

[project.scripts]
oceanscale = "oceanscale.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7",
]
rl = [
    # legacy alias — RL deps moved to base in v0.1 so demo works after default install
    # kept for back-compat with users who do `pip install oceanscale[rl]`
    "gymnasium>=0.29",
    "stable-baselines3>=2.5",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oceanscale*"]

[tool.setuptools.package-data]
oceanscale = ["data/*.zip", "data/*.pkl"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]
ignore = [
    "RUF001",  # Ambiguous unicode characters in strings (we use × ν for math notation)
    "RUF002",  # Ambiguous unicode in docstrings (× ν)
    "RUF003",  # Ambiguous unicode in comments
    "N806",    # Variable in function should be lowercase (we use M_A, M_RB, etc., from Fossen)
    "N803",    # Argument name should be lowercase (M_A, M_RB Fossen notation)
    "B008",    # Function call in argument defaults (acceptable here)
    "E741",    # Ambiguous variable name 'I' (used for inertia per Fossen)
    "E501",    # Line too long — math comments need wide width for readability
]
per-file-ignores = {"tests/**/*.py" = ["B011"]}

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU",
    "slow: takes >10s",
]
