[project]
name = "oceanscale"
version = "0.1.0"
description = "GPU-native fluid-structure simulation for underwater robotics"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "warp-lang[torch-cu12]>=1.13.0,<2.0",
    "newton[examples,torch-cu12]>=1.2.0,<1.3",  # tight upper-bound per R19: 3 minors in 30 days, sub-minor breaking changes documented
    "torch>=2.7.0,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "usd-core>=25.11",
    "hydra-core>=1.3,<2.0",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7",
]
# rl extra deferred — rl-games 1.6.x pins psutil<6 which conflicts with warp-lang 1.13 (psutil>=7.1)
# Move to v0.2 when rl-games releases psutil>=7 compatible version, or install in separate venv
# rl = [
#     "rl-games>=1.6.0,<2.0",
#     "gymnasium>=0.29",
# ]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]
ignore = [
    "RUF001",  # Ambiguous unicode characters in strings (we use × ν for math notation)
    "RUF002",  # Ambiguous unicode in docstrings (× ν)
    "RUF003",  # Ambiguous unicode in comments
    "N806",    # Variable in function should be lowercase (we use M_A, M_RB, etc., from Fossen)
    "N803",    # Argument name should be lowercase (M_A, M_RB Fossen notation)
    "B008",    # Function call in argument defaults (acceptable here)
    "E741",    # Ambiguous variable name 'I' (used for inertia per Fossen)
    "E501",    # Line too long — math comments need wide width for readability
]
per-file-ignores = {"tests/**/*.py" = ["B011"]}

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU",
    "slow: takes >10s",
]
