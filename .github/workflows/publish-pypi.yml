name: Package Build Check (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate package artifacts
    runs-on: oceanscale-arc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine tomli

      - name: Check package version metadata
        run: |
          PKG=$(python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Package version: $PKG"

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
