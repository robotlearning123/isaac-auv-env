name: Feature request
description: Suggest a new feature or capability
title: "[feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: User pain point or missing capability.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Python package (oceanscale/)
        - Website (website/)
        - Benchmarks
        - Notebooks
        - Documentation
        - Cross-cutting
    validations:
      required: true
