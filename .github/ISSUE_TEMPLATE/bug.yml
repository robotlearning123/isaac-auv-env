name: Bug
description: Report a bug or unexpected behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal reproducible example. Include commands, env, and exact output.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OceanScale version
      description: Output of `oceanscale --version` or commit SHA.
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU / CUDA
      description: e.g. RTX 5090 / CUDA 12.8

  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. Ubuntu 24.04, macOS 15

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
