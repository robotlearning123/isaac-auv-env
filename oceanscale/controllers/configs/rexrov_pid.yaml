# Standard PID
pid:
  Kp: [3300, 3300, 3300, 3300, 3300, 330]
  Kd: [1100, 1100, 1100, 1100, 1100, 1100]
  Ki: [0, 0, 0, 0, 0, 0]

# Nonlinear PID
nl_pid:
  Kp: [500, 500, 500, 300, 300, 300]
  Kd: [50, 50, 50, 20, 20, 20]
  Ki: [200, 200, 200, 100, 100, 100]
  Hm: [50, 50, 50, 40, 40, 40]

# Cascaded PID (position outer → velocity inner)
cascaded:
  position:
    Kp: [0.8, 0.8, 0.8, 0.3, 0.3, 0.3]
    Ki: [0.0005, 0.0005, 0.0005, 0.001, 0.001, 0.001]
    Kd: [0.0005, 0.0005, 0.0005, 0.001, 0.001, 0.001]
    sat: [1.0, 1.0, 1.0, 2.0, 2.0, 2.0]
  velocity:
    Kp: [10, 10, 10, 10, 10, 10]
    Ki: [2, 2, 2, 2, 2, 2]
    Kd: [0, 0, 0, 0, 0, 0]
    sat: [20, 20, 20, 5, 5, 5]

# Non-model-based Sliding Mode
nmb_sm:
  K: [5, 5, 5, 5, 5, 5]
  Kd: [1100, 1100, 1100, 1100, 1100, 1100]
  Ki: [0.09, 0.09, 0.09, 0.09, 0.09, 0.09]
  slope: [3, 3, 3, 3, 3, 3]

# Model-based Sliding Mode
mb_sm:
  lambda: [10, 10, 10, 10, 10, 10]
  rho_constant: [10000, 10000, 10000, 10000, 10000, 10000]
  k: [500, 500, 500, 500, 500, 500]
  c: [50, 50, 50, 1, 1, 1]
  adapt_slope: [100, 10, 10]
  rho_0: [3000, 3000, 8000, 1500, 1500, 8000]
  drift_prevent: 0.03

# Dynamic model params (for model-based controllers)
model:
  mass: 1862.87
  volume: 1.83826
  cog: [0, 0, 0]
  cob: [0, 0, 0.3]
  added_mass: [700, 1200, 3500, 500, 800, 200]
  linear_damping: [-70, -70, -700, -200, -300, -100]
  quad_damping: [-700, -900, -1800, -600, -700, -500]
