task: Hover
vehicle: BlueROV
controller: LeePositionController

env:
  num_envs: 64
  env_spacing: 6
  max_episode_length: 200

reward:
  effort_weight: 0.1
  action_smoothness_weight: 0.0
  distance_scale: 1.2

randomization:
  body:
    mass_scale: [0.8, 1.2]
    volume_scale: [0.9, 1.1]
    coBM_scale: [0.5, 1.5]
    inertia_scale: [0.8, 1.2]
    added_mass_scale: [0.5, 1.0]
    linear_damping_scale: [0.5, 1.0]
    quadratic_damping_scale: [0.5, 1.0]
  rotor:
    time_constants_scale: [0.8, 1.2]
    force_constants_scale: [0.8, 1.2]

disturbances:
  flow:
    max_flow_velocity: [0.5, 0.5, 0.5, 0.0, 0.0, 0.0]
    flow_velocity_gaussian_noise: [0.1, 0.1, 0.1, 0.0, 0.0, 0.0]
  payload:
    mass: [0.01, 0.2]
    z: [-0.1, 0.1]
