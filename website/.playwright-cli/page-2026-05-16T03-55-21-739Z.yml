    - generic [ref=e65]:
      - generic [ref=e66]: /02 · Why
      - heading "Five constraints holding marine robotics back" [level=2] [ref=e67]
      - list [ref=e68]:
        - listitem [ref=e69]:
          - generic [ref=e70]: "01"
          - generic [ref=e71]:
            - heading "Real ocean trials cost so much they cap iteration" [level=3] [ref=e72]
            - paragraph [ref=e73]: "A day at sea: ¥10k–¥100k+. Corrosion, entanglement, gear loss. Non-reproducible currents. Progress gated by weather. Without high-fidelity simulation, iteration speed is locked to nature's clock."
        - listitem [ref=e74]:
          - generic [ref=e75]: "02"
          - generic [ref=e76]:
            - heading "CFD is too slow for RL to even start" [level=3] [ref=e77]
            - paragraph [ref=e78]: "Hi-fi CFD: 1 second of physics takes 1–100 hours to compute. The 1M+ episodes RL needs is mathematically unreachable. Even GPU-accelerated CFD can't approach the real-time × 1000× threshold the field actually requires."
        - listitem [ref=e79]:
          - generic [ref=e80]: "03"
          - generic [ref=e81]:
            - heading "Legacy underwater sims waste modern GPUs" [level=3] [ref=e82]
            - paragraph [ref=e83]: "Gazebo / UWSim / HoloOcean: single-threaded CPU at hundreds of FPS. RTX 5090 / H100 compute is wasted. Multi-agent parallelism is near zero."
        - listitem [ref=e84]:
          - generic [ref=e85]: "04"
          - generic [ref=e86]:
            - heading "The sim-to-real gap kills policy transfer" [level=3] [ref=e87]
            - paragraph [ref=e88]: Insufficient fluid fidelity — sim policies collapse in water. No principled sim-to-real calibration. Sensor simulation (sonar, underwater camera) is oversimplified, creating false confidence.
        - listitem [ref=e89]:
          - generic [ref=e90]: "05"
          - generic [ref=e91]:
            - heading "AI-native interfaces are missing" [level=3] [ref=e92]
            - paragraph [ref=e93]: Gym/gymnasium adapters absent or low-quality. Poor multi-agent scene support. Multimodal marine datasets (sonar, optical, IMU) aren't open — foundation-model training is gated by data scarcity.
