    - generic [ref=e76]:
      - generic [ref=e77]: /02 · Why
      - heading "海洋机器人发展的五个枷锁" [level=2] [ref=e78]
      - list [ref=e79]:
        - listitem [ref=e80]:
          - generic [ref=e81]: "01"
          - generic [ref=e82]:
            - heading "真实海上测试,昂贵到锁死创新节奏" [level=3] [ref=e83]
            - paragraph [ref=e84]: 出海一天 ¥10,000–¥100,000+。腐蚀、缠绕、设备丢失。环境不可复现,进度看天气。没有高保真仿真,迭代节奏被自然界设了上限。
        - listitem [ref=e85]:
          - generic [ref=e86]: "02"
          - generic [ref=e87]:
            - heading "CFD 太慢,RL 训练根本不可达" [level=3] [ref=e88]
            - paragraph [ref=e89]: 高保真 CFD:1 秒物理 = 1–100 小时计算。 RL 训练所需的 1M+ episodes 数量级不可达。 GPU 加速的 CFD 也够不到 real-time × 1000 倍的实战门槛。
        - listitem [ref=e90]:
          - generic [ref=e91]: "03"
          - generic [ref=e92]:
            - heading "现有水下仿真器,浪费现代 GPU 算力" [level=3] [ref=e93]
            - paragraph [ref=e94]: Gazebo / UWSim / HoloOcean 仍是单线程 CPU,百级 FPS。 RTX 5090 / H100 的算力被白白浪费。多智能体并行能力接近零。
        - listitem [ref=e95]:
          - generic [ref=e96]: "04"
          - generic [ref=e97]:
            - heading "Sim-to-real gap,卡死策略上桥" [level=3] [ref=e98]
            - paragraph [ref=e99]: 流体保真度不足,策略迁移失败。缺乏可信的 sim-to-real 校准方法。传感器仿真常被过度简化 —— 仿真里完美,水里崩溃。
        - listitem [ref=e100]:
          - generic [ref=e101]: "05"
          - generic [ref=e102]:
            - heading "AI-native 接口缺失,生态没追上时代" [level=3] [ref=e103]
            - paragraph [ref=e104]: gym/gymnasium 适配缺失或低质。多智能体场景支持差。多模态海洋数据集 (sonar / optical / IMU) 不开放,基础模型训练受困于数据稀缺。
