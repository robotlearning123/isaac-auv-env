    - generic [ref=e66]:
      - generic [ref=e67]: /02 · Why
      - heading "Five constraints holding marine robotics back" [level=2] [ref=e68]
      - list [ref=e69]:
        - listitem [ref=e70]:
          - generic [ref=e71]: "01"
          - generic [ref=e72]:
            - heading "Real ocean trials cost so much they cap iteration" [level=3] [ref=e73]
            - paragraph [ref=e74]: "A day at sea: ¥10k–¥100k+. Corrosion, entanglement, gear loss. Non-reproducible currents. Progress gated by weather. Without high-fidelity simulation, iteration speed is locked to nature's clock."
        - listitem [ref=e75]:
          - generic [ref=e76]: "02"
          - generic [ref=e77]:
            - heading "CFD is too slow for RL to even start" [level=3] [ref=e78]
            - paragraph [ref=e79]: "Hi-fi CFD: 1 second of physics takes 1–100 hours to compute. The 1M+ episodes RL needs is mathematically unreachable. Even GPU-accelerated CFD can't approach the real-time × 1000× threshold the field actually requires."
        - listitem [ref=e80]:
          - generic [ref=e81]: "03"
          - generic [ref=e82]:
            - heading "Legacy underwater sims waste modern GPUs" [level=3] [ref=e83]
            - paragraph [ref=e84]: "Gazebo / UWSim / HoloOcean: single-threaded CPU at hundreds of FPS. RTX 5090 / H100 compute is wasted. Multi-agent parallelism is near zero."
        - listitem [ref=e85]:
          - generic [ref=e86]: "04"
          - generic [ref=e87]:
            - heading "The sim-to-real gap kills policy transfer" [level=3] [ref=e88]
            - paragraph [ref=e89]: Insufficient fluid fidelity — sim policies collapse in water. No principled sim-to-real calibration. Sensor simulation (sonar, underwater camera) is oversimplified, creating false confidence.
        - listitem [ref=e90]:
          - generic [ref=e91]: "05"
          - generic [ref=e92]:
            - heading "AI-native interfaces are missing" [level=3] [ref=e93]
            - paragraph [ref=e94]: Gym/gymnasium adapters absent or low-quality. Poor multi-agent scene support. Multimodal marine datasets (sonar, optical, IMU) aren't open — foundation-model training is gated by data scarcity.
